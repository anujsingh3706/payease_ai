# docker-compose.yml

version: "3.9"

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: payease_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       payease_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payease_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payease_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payease_net

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: payease_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-payease_secure_2024}@db:5432/payease_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ml_models_data:/app/ml_models    # Persist trained models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - payease_net

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: payease_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - payease_net

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  ml_models_data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  payease_net:
    driver: bridge